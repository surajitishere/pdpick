[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdpick"
version = "0.1.0"
description = "Exact, quality-aware phylogenetic-diversity subsampling of large trees."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Surajit Mondal" }]
requires-python = ">=3.10"
keywords = [
  "phylogenetics",
  "phylogenetic diversity",
  "genome selection",
  "subsampling",

]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
examples = ["matplotlib>=3.7"]

[project.scripts]
pdpick = "pdpick.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdpick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
